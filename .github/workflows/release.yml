name: Build and release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package.json version v$version"
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use project npm version
        shell: pwsh
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global $packageManager

      - name: Install locked dependencies and Electron native modules
        run: npm ci

      - name: Check types, formatting and unit tests
        run: npm run check

      - name: Check workflow formatting
        run: npx --no-install prettier --check .github/workflows/release.yml

      - name: Test SQLite and worker integration in Electron
        run: npm run test:integration

      - name: Build NSIS installer
        run: npm run dist -- --publish never

      - name: Smoke test the packaged application
        shell: pwsh
        run: |
          $env:PICKUP_PACKAGED_EXE = (Resolve-Path 'dist/win-unpacked/PickUp.exe').Path
          npx --no-install playwright test tests/e2e/logo.spec.ts tests/e2e/desktop.spec.ts tests/e2e/app.spec.ts --grep '主窗口与桌面入口加载同一品牌原图|独立 capture 窗口与桌面状态桥接可用|桥接的完整业务链路在重启后保持一致|重启后读取已确认保存的状态'

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No installer was produced' }
          $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8

      - name: Upload installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pickup-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pickup-build-diagnostics
          path: |
            test-results/
            playwright-report/
            dist/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pickup-windows-x64
          path: release

      - name: Create release with installer and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=("$RELEASE_TAG" --verify-tag --generate-notes --title "PickUp $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "${args[@]}" release/*.exe release/SHA256SUMS.txt
