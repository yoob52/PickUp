apply plugin: 'com.android.application'

def packageVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def pickupVersion = providers.gradleProperty('pickupVersionName').getOrElse(packageVersion)
if (!(pickupVersion ==~ /(?:0|[1-9][0-9]{0,5})\.(?:0|[1-9][0-9]?)\.(?:0|[1-9][0-9]?)/)) {
    throw new GradleException('Android version must be canonical X.Y.Z with minor and patch in 0..99.')
}
def (major, minor, patch) = pickupVersion.tokenize('.').collect { it.toInteger() }
def pickupCode = major * 10000L + minor * 100L + patch
if (pickupCode < 1 || pickupCode > 2100000000L) {
    throw new GradleException('Android versionCode must be in 1..2100000000.')
}

def releaseSigning = ['ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS']
    .collectEntries { name -> [(name): providers.environmentVariable(name).orNull] }
def signingValues = releaseSigning.values().count { value -> value != null && !value.isEmpty() }
if (signingValues > 0 && signingValues < releaseSigning.size()) {
    throw new GradleException('Partial release signing configuration: set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS together, or leave all unset.')
}
def hasReleaseSigning = signingValues == releaseSigning.size()
if (hasReleaseSigning && !file(releaseSigning.ANDROID_KEYSTORE_FILE).isFile()) {
    throw new GradleException('The configured release keystore file does not exist.')
}

android {
    namespace "com.yoob52.pickup"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yoob52.pickup"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pickupCode.toInteger()
        versionName pickupVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigning.ANDROID_KEYSTORE_FILE)
                storePassword releaseSigning.ANDROID_KEYSTORE_PASSWORD
                keyPassword releaseSigning.ANDROID_KEY_PASSWORD
                keyAlias releaseSigning.ANDROID_KEY_ALIAS
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
